name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: Run Gradle script tests
        run: python3 -B -m unittest discover -s gradle
      - name: Run Android unit tests, lint, and detekt
        timeout-minutes: 20
        run: ./gradlew testDebugUnitTest lint detekt --build-cache
