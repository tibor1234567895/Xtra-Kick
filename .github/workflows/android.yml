name: Build

# Builds are manual: run from the Actions tab ("Run workflow") or
# `gh workflow run Build`. Merges/pushes to main no longer trigger releases.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after compatibility and regression checks pass
        type: boolean
        default: true

# Keep another dispatch from interrupting an asset promotion.
concurrency:
  group: ${{ inputs.publish && 'android-release' || format('android-build-only-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.publish }}

jobs:
  checks:
    if: inputs.publish && toJSON(github.event.repository.private) == 'false'
    name: Android checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read

  compatibility:
    needs: [checks, build]
    if: inputs.publish && toJSON(github.event.repository.private) == 'false'
    uses: ./.github/workflows/compatibility.yml
    permissions:
      contents: read
      actions: read
    with:
      profile: release

  build:
    if: toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.version.outputs.code }}
      artifact-id: ${{ steps.transfer.outputs.artifact-id }}
    env:
      ORG_GRADLE_PROJECT_KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
      ORG_GRADLE_PROJECT_KICK_OAUTH_BACKEND_BASE_URL: ${{ secrets.KICK_OAUTH_BACKEND_BASE_URL }}
      ORG_GRADLE_PROJECT_KICK_OAUTH_BACKEND_HMAC_SECRET: ${{ secrets.KICK_OAUTH_BACKEND_HMAC_SECRET }}
      ORG_GRADLE_PROJECT_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      # Required for release packaging.
      ORG_GRADLE_PROJECT_KICK_VIEWER_CLIENT_TOKEN: ${{ secrets.KICK_VIEWER_CLIENT_TOKEN }}
      ORG_GRADLE_PROJECT_RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/app/release-keystore.jks
      ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Check repository artifact headroom
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -B gradle/check_artifact_headroom.py
    - name: Setup Java
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: true
    - name: Ensure Android SDK platform is installed
      run: test -f "$ANDROID_HOME/platforms/android-37.0/android.jar" || sdkmanager 'platforms;android-37.0'

    # Required: without it the release signing config is absent and the build fails by
    # design, rather than silently falling back to the debug key as it used to.
    - name: Decode release keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks

    - name: Prepare release version
      id: version
      run: |
        code=$(python3 -B gradle/release_version.py ci --output build/release-version.json)
        echo "code=$code" >> "$GITHUB_OUTPUT"

    - name: Build Release with Gradle
      run: |
        ./gradlew :app:assembleRelease -PreleaseVersionCode=${{ steps.version.outputs.code }} --build-cache --parallel || \
          (sleep 15 && ./gradlew :app:assembleRelease -PreleaseVersionCode=${{ steps.version.outputs.code }} --build-cache --parallel)

    - name: Verify release signature
      run: |
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
        "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk

    - name: Verify release ARM architectures
      run: |
        python3 - <<'PY'
        from pathlib import Path
        from zipfile import ZipFile

        apk = Path("app/build/outputs/apk/release/app-release.apk")
        with ZipFile(apk) as archive:
            native_libraries = [
                name for name in archive.namelist()
                if name.startswith("lib/") and name.endswith(".so")
            ]
        expected_abis = {"arm64-v8a", "armeabi-v7a"}
        actual_abis = {name.split("/")[1] for name in native_libraries}
        if actual_abis != expected_abis:
            raise SystemExit(f"Expected {sorted(expected_abis)}, found {sorted(actual_abis)}")
        libraries = {
            abi: {Path(name).name for name in native_libraries if name.split("/")[1] == abi}
            for abi in expected_abis
        }
        if libraries["arm64-v8a"] != libraries["armeabi-v7a"]:
            raise SystemExit(f"Native library mismatch: {libraries}")
        print(f"Verified both ARM architectures: {sorted(libraries['arm64-v8a'])}")
        PY

    - name: Stage verified APK and build metadata
      run: |
        mkdir release-transfer
        cp app/build/outputs/apk/release/app-release.apk release-transfer/
        cp build/release-version.json app/build/outputs/mapping/release/mapping.txt release-transfer/
        (cd release-transfer && sha256sum app-release.apk release-version.json mapping.txt > SHA256SUMS)
        ls -lh release-transfer
        transfer_bytes="$(du -sb release-transfer | cut -f1)"
        echo "Uncompressed release-transfer size: ${transfer_bytes} bytes"
        if [ "$transfer_bytes" -gt 150000000 ]; then
          echo "release-transfer exceeded 150 MB uncompressed cap (${transfer_bytes} bytes)" >&2
          exit 1
        fi

    - name: Upload compiled release APK
      id: transfer
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: compiled-release-b${{ steps.version.outputs.code }}-${{ github.run_attempt }}
        path: release-transfer/
        retention-days: 1
        if-no-files-found: error

  publish:
    needs: [build, checks, compatibility]
    if: inputs.publish && needs.build.result == 'success' && needs.checks.result == 'success' && needs.compatibility.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 50
        filter: blob:none
        fetch-tags: true
        persist-credentials: false
    - name: Download verified release APK
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        artifact-ids: ${{ needs.build.outputs.artifact-id }}
        path: release-transfer
    - name: Verify transferred release files
      working-directory: release-transfer
      run: sha256sum -c SHA256SUMS
    - name: Recover a pending release
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -B gradle/publish_release.py --recover
    - name: Upload R8 mapping artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mapping-b${{ needs.build.outputs.code }}
        path: release-transfer/mapping.txt
        retention-days: 90
        if-no-files-found: error
        overwrite: true

    - name: Generate release notes
      run: |
        git fetch --tags --force
        if git rev-parse refs/tags/latest >/dev/null 2>&1; then
          git log refs/tags/latest..HEAD --format="%s%n%b" -- app/src/main/ gradle/libs.versions.toml > notes.txt
        fi
        if [ ! -s notes.txt ]; then
          git log -n 1 --format="%s%n%b" > notes.txt
        fi
        [ -s notes.txt ] || echo "Release build $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > notes.txt
        echo "" >> notes.txt
        echo "Active Changelog: https://github.com/tibor1234567895/Xtra-Kick/commits/main" >> notes.txt

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_CODE: ${{ needs.build.outputs.code }}
      run: |
        python3 -B gradle/publish_release.py "$RELEASE_CODE" "$GITHUB_SHA" notes.txt \
          release-transfer/app-release.apk release-transfer/release-version.json || \
          python3 -B gradle/publish_release.py --recover --required

    - name: Recover interrupted publication
      if: cancelled()
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -B gradle/publish_release.py --recover

    - name: Submit Release APK to VirusTotal
      continue-on-error: true
      env:
        VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      run: |
        if [ -z "$VIRUSTOTAL_API_KEY" ]; then
          echo "VIRUSTOTAL_API_KEY not set; skipping VirusTotal submission."
          exit 0
        fi
        APK_FILE=release-transfer/app-release.apk
        echo "Submitting $APK_FILE to VirusTotal..."
        curl --silent --show-error --request POST \
          --url "https://www.virustotal.com/api/v3/files" \
          --header "x-apikey: $VIRUSTOTAL_API_KEY" \
          --form "file=@$APK_FILE"

