name: Build

# Builds are manual: run from the Actions tab ("Run workflow") or
# `gh workflow run Build`. Merges/pushes to main no longer trigger releases.
on:
  workflow_dispatch:

# A newer push to main supersedes the run in progress. The publish steps sit at
# the very end and finish in seconds, so an interrupted publish self-heals on
# the next successful run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ORG_GRADLE_PROJECT_KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
      ORG_GRADLE_PROJECT_KICK_OAUTH_BACKEND_BASE_URL: ${{ secrets.KICK_OAUTH_BACKEND_BASE_URL }}
      ORG_GRADLE_PROJECT_KICK_OAUTH_BACKEND_HMAC_SECRET: ${{ secrets.KICK_OAUTH_BACKEND_HMAC_SECRET }}
      ORG_GRADLE_PROJECT_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      # Optional: empty falls through to the known-good default baked into build.gradle.kts.
      ORG_GRADLE_PROJECT_KICK_VIEWER_CLIENT_TOKEN: ${{ secrets.KICK_VIEWER_CLIENT_TOKEN }}
      ORG_GRADLE_PROJECT_RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/app/release-keystore.jks
      ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
    - name: Checkout sources
      uses: actions/checkout@v7
      with:
        fetch-depth: 50
        filter: blob:none
        fetch-tags: true
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.4.1

    # Required: without it the release signing config is absent and the build fails by
    # design, rather than silently falling back to the debug key as it used to.
    - name: Decode release keystore
      run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release-keystore.jks

    - name: Prepare release version
      id: version
      run: |
        python3 -B -m unittest discover -s gradle -p test_release_version.py
        code=$(python3 -B gradle/release_version.py ci --run-number "$GITHUB_RUN_NUMBER" --output build/release-version.json)
        echo "code=$code" >> "$GITHUB_OUTPUT"

    - name: Build Release with Gradle
      run: ./gradlew assembleRelease -PreleaseVersionCode=${{ steps.version.outputs.code }} --build-cache --parallel

    - name: Verify release signature
      run: |
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
        "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk

    - name: Verify release ARM architectures
      run: |
        python3 - <<'PY'
        from pathlib import Path
        from zipfile import ZipFile

        apk = Path("app/build/outputs/apk/release/app-release.apk")
        with ZipFile(apk) as archive:
            native_libraries = [
                name for name in archive.namelist()
                if name.startswith("lib/") and name.endswith(".so")
            ]
        expected_abis = {"arm64-v8a", "armeabi-v7a"}
        actual_abis = {name.split("/")[1] for name in native_libraries}
        if actual_abis != expected_abis:
            raise SystemExit(f"Expected {sorted(expected_abis)}, found {sorted(actual_abis)}")
        libraries = {
            abi: {Path(name).name for name in native_libraries if name.split("/")[1] == abi}
            for abi in expected_abis
        }
        if libraries["arm64-v8a"] != libraries["armeabi-v7a"]:
            raise SystemExit(f"Native library mismatch: {libraries}")
        print(f"Verified both ARM architectures: {sorted(libraries['arm64-v8a'])}")
        PY

    - name: Generate release notes
      run: |
        git fetch --tags --force
        if git rev-parse refs/tags/latest >/dev/null 2>&1; then
          git log refs/tags/latest..HEAD --format="%s%n%b" > notes.txt
        fi
        if [ ! -s notes.txt ]; then
          git log -n 1 --format="%s%n%b" > notes.txt
        fi
        [ -s notes.txt ] || echo "Release build $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > notes.txt
        echo "" >> notes.txt
        echo "Active Changelog: https://github.com/tibor1234567895/Xtra-Kick/commits/main" >> notes.txt

    - name: Update tag
      run: |
        git tag -f latest
        git push -f origin latest

    - name: Delete release
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release delete latest -y

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create latest --title "Latest" --notes-file notes.txt --latest=true 'app/build/outputs/apk/release/*.apk' build/release-version.json

    - name: Submit Release APK to VirusTotal
      continue-on-error: true
      env:
        VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      run: |
        if [ -z "$VIRUSTOTAL_API_KEY" ]; then
          echo "VIRUSTOTAL_API_KEY not set; skipping VirusTotal submission."
          exit 0
        fi
        APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
        echo "Submitting $APK_FILE to VirusTotal..."
        curl --silent --show-error --request POST \
          --url "https://www.virustotal.com/api/v3/files" \
          --header "x-apikey: $VIRUSTOTAL_API_KEY" \
          --form "file=@$APK_FILE"

