name: Build

# Builds are manual: run from the Actions tab ("Run workflow") or
# `gh workflow run Build`. Merges/pushes to main no longer trigger releases.
on:
  workflow_dispatch:

# A newer push to main supersedes the run in progress. The publish steps sit at
# the very end and finish in seconds, so an interrupted publish self-heals on
# the next successful run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ORG_GRADLE_PROJECT_KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
      ORG_GRADLE_PROJECT_KICK_OAUTH_BACKEND_BASE_URL: ${{ secrets.KICK_OAUTH_BACKEND_BASE_URL }}
      ORG_GRADLE_PROJECT_KICK_OAUTH_BACKEND_HMAC_SECRET: ${{ secrets.KICK_OAUTH_BACKEND_HMAC_SECRET }}
      ORG_GRADLE_PROJECT_RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/app/release-keystore.jks
      ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
    - name: Checkout sources
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        filter: blob:none
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.3.0

    # Required: without it the release signing config is absent and the build fails by
    # design, rather than silently falling back to the debug key as it used to.
    - name: Decode release keystore
      run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release-keystore.jks

    - name: Test, lint, and build with Gradle
      run: ./gradlew testDebugUnitTest lintDebug assembleRelease

    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: check-reports
        path: |
          app/build/reports/tests/
          app/build/reports/lint-results-debug.html

    - name: Verify release signature
      run: |
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
        "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v6
      with:
        name: apk
        path: app/build/outputs/apk/release/*.apk

    - name: Generate release notes
      run: |
        if git rev-parse refs/tags/latest >/dev/null 2>&1; then
          git log refs/tags/latest..HEAD --oneline --decorate=no > notes.txt
        else
          git log -n 50 --oneline --decorate=no > notes.txt
        fi
        [ -s notes.txt ] || echo "Release build $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > notes.txt
        echo "" >> notes.txt
        echo "Active Changelog: https://github.com/tibor1234567895/Xtra-Kick/commits/main" >> notes.txt

    - name: Update tag
      run: |
        git tag -f latest
        git push -f origin latest

    - name: Delete release
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release delete latest -y

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create latest --title "Latest" --notes-file notes.txt --latest=true 'app/build/outputs/apk/release/*.apk'
